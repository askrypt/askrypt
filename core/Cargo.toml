[package]
name = "askrypt-core"
description = "Askrypt core: encryption, key derivation, vault format, transliteration and password generation"
authors = [
    "Ruslan Absaliamov <ruslan.absalyamov@gmail.com>",
]
version = "0.6.2-dev"
edition = "2024"
license = "Apache-2.0"
homepage = "https://github.com/askrypt/askrypt"
repository = "https://github.com/askrypt/askrypt"
keywords = ["password-manager", "password", "encryption", "aes", "pbkdf2"]
categories = [
    "cryptography",
    "security",
]

# Keep the library name `askrypt` so dependents (desktop binary, doctests,
# future mobile bindings) refer to it as `askrypt::...`.
[lib]
name = "askrypt"
path = "src/lib.rs"

# The networked `VaultStorage` backend is opt-in: a plain `askrypt-core` build
# stays free of HTTP and TLS, so only clients that actually talk to a server
# (today the desktop binary) pay for the dependency tree.
[features]
default = []
server-storage = ["dep:ureq"]

[dependencies]
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
sha2 = "0.11.0"
rand = "0.10.1"
aes = "0.9.1"
cbc = "0.2.1"
cipher = { version = "0.5.2", features = ["block-padding"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
zip = "8.6.0"
zeroize = { version = "1", features = ["derive"] }
# Vault write stamp (`params.updated_at` / `params.host`); no clock/tz machinery
# is needed beyond `Utc::now()`, hence the trimmed feature set.
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }
gethostname = "1.1"
# `VaultStorage` is synchronous, so the HTTP client must be too. `ureq` blocks
# natively; `reqwest::blocking` would spin up its own tokio runtime and panics
# when built inside an async context — which is exactly where the desktop app
# calls storage from (`spawn_blocking`). rustls, never native-tls, to keep
# OpenSSL out of the build (the server crate makes the same choice).
ureq = { version = "3", optional = true, default-features = false, features = ["rustls", "json"] }

# Manual end-to-end conformance run against a *local* `askrypt-server`; needs
# the backend it exercises, so it is skipped by a plain `cargo build --examples`.
# A directory rather than a single file: it walks the whole HTTP surface, and
# each group of checks lives in its own module.
[[example]]
name = "server_roundtrip"
path = "examples/server_roundtrip/main.rs"
required-features = ["server-storage"]

[dev-dependencies]
hex = "0.4.3"
