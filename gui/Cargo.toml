[package]
name = "askrypt-gui"
description = "The new three-pane Askrypt desktop UI"
version = "0.7.0-dev"
edition = "2024"
license = "Apache-2.0"
publish = false

# The crypto, vault format and storage backends come from the shared core crate,
# exactly as the root `askrypt` package takes them. The `iced` and `chrono`
# feature lists intentionally match that package so both builds share one
# compiled `iced` instead of forcing a full recompile every time you alternate
# between them.
[dependencies]
askrypt-core = { path = "../core", features = ["server-storage"] }
iced = { version = "0.14.0", features = ["image", "fira-sans", "tokio"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.17.2"
open = "5.3.5"
image = "0.25.10"
tray-item = "0.10.0"
zeroize = "1"
# `spawn_blocking` for off-main-thread key derivation and vault I/O (matches
# iced's tokio); `time` is the delay behind the clipboard auto-clear.
tokio = { version = "1", features = ["rt", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-item = { version = "0.10.0", features = ["ksni"] }
