[package]
name = "askrypt-server"
description = "Askrypt cloud server: accounts + opaque encrypted-vault storage"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Scope rule (see PLAN.md): the server is a dumb encrypted-blob store. It must
# NEVER depend on `askrypt-core` — all vault crypto stays in the clients.

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
tower-http = { version = "0.6", features = ["fs"] }
argon2 = "0.5"
getrandom = "0.3"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
