[package]
name = "askrypt-server"
description = "Askrypt cloud server: accounts + opaque encrypted-vault storage"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Scope rule (see PLAN.md): the server is a dumb encrypted-blob store. It must
# NEVER depend on `askrypt-core` — all vault crypto stays in the clients.

[dependencies]
# `multipart` backs the website's vault upload form (Phase 7.4); native
# clients keep posting raw bytes to `/api/v1/vaults`.
axum = { version = "0.8", features = ["multipart"] }
# `time` for the request-timeout middleware, `sync` for the concurrency and
# argon2 semaphores (Phase 5 hardening).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tracing = "0.1"
# `json` backs ASKRYPT_LOG_FORMAT=json, so audit events ship as structured logs.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Daily-rotating log files under ASKRYPT_LOG_DIR, written from a background
# thread so a slow disk never blocks a request handler.
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
tower-http = { version = "0.6", features = ["fs"] }
argon2 = "0.5"
getrandom = "0.3"
sha2 = "0.10"
# Read-only peek at a vault's two unencrypted stamp fields (`src/vaultfile.rs`).
# Deflate alone: the server decompresses one small JSON member and never
# writes an archive, and this must not become a second way into the format —
# the scope rule keeps `askrypt-core` out of this crate.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# SMTP delivery for the `Mailer` seam. rustls (not native-tls) to match
# reqwest and keep OpenSSL out of the build; `ring` is the only crypto
# provider either crate pulls in, so rustls picks it without ambiguity.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "pool", "tokio1-rustls-tls", "hostname", "builder"] }
# Website (Phase 7). Templates compile into the binary, so there is no
# template directory to ship and no JS toolchain anywhere in the build.
askama = "0.16"
# The CSRF extractor parses a form body twice: once for the token field,
# once for the handler's own DTO. No cookie crate: `web::session` formats
# the three `Set-Cookie` values it needs by hand, which keeps the exact
# attribute string visible and under test.
serde_urlencoded = "0.7"

# `statvfs` for the free-space figure in the startup notice (src/sysinfo.rs).
# Already in the tree via tokio; std has no API for it, and a `df` subprocess
# would need coreutils in the runtime image.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# `io-util` for the fake SMTP server in `store::smtp`'s tests; the rest of
# the features come from the main dependency above.
tokio = { version = "1", features = ["io-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
