<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Askrypt</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1c1c1e;
      --muted: #6b6b70;
      --accent: #3a7bd5;
      --bg: #f5f5f7;
      --card: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ececf0;
        --muted: #9a9aa2;
        --accent: #6ea8ff;
        --bg: #111114;
        --card: #1b1b1f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      background: var(--card);
      border-radius: 12px;
      padding: 3rem 3.5rem;
      max-width: 26rem;
      text-align: center;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 2rem;
      letter-spacing: 0.02em;
    }
    h1 .lock { color: var(--accent); }
    p { margin: 0.5rem 0; color: var(--muted); line-height: 1.5; }
    code {
      font-family: ui-monospace, "Cascadia Code", monospace;
      font-size: 0.9em;
      background: color-mix(in srgb, var(--fg) 8%, transparent);
      border-radius: 4px;
      padding: 0.1em 0.35em;
    }
  </style>
</head>
<body>
  <main>
    <h1><span class="lock">&#128274;</span> Askrypt</h1>
    <p>Cloud storage for encrypted Askrypt vaults.</p>
    <p>The web app is coming soon. The JSON API lives under
      <code>/api/v1</code>.</p>
  </main>
</body>
</html>
