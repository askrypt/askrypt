# Self-hosting stack: askrypt-server behind Caddy for TLS.
#
# This file is *deployed*, not built from: `./deploy.sh dev|prod` builds the
# image locally (docker-build.sh), ships it as a tarball, and runs `run.sh`
# from /home/askrypt-server on the server. There is no `build:` section, so
# the server needs no source checkout and no rust toolchain.
#
# Bring it up with the `run.sh` beside this file rather than `docker compose
# up` — the server's data and logs are *bind mounts* now, and bind mounts do
# not inherit the image directory's ownership the way named volumes do. The
# host directories have to exist and belong to the image's uid 10001 before
# the container starts, which is what run.sh does.
#
#   ./server/deploy/docker-build.sh     # build the image first
#   ASKRYPT_DOMAIN=localhost ./server/deploy/run.sh
#
# Host-specific values (the domain) and secrets (the SMTP password) come from
# a `.env` file beside this one, which compose reads by itself and which is
# never uploaded by the deploy — see env.example.

# Pinned so Caddy's volume names are the same wherever the file sits: without
# it the project name is the directory's, and the certificates would go
# missing the day the deploy path changes.
name: askrypt

services:
  askrypt-server:
    image: "${ASKRYPT_IMAGE:-askrypt-server:latest}"
    # Loaded from the tarball the deploy ships; there is no registry to pull
    # it from, and `never` turns a missing image into a clear error instead of
    # a confusing pull failure.
    pull_policy: never
    container_name: askrypt-server
    restart: unless-stopped
    # No published ports: only Caddy may reach it, which is what makes
    # ASKRYPT_TRUST_PROXY=1 (baked into the image) safe.
    expose:
      - "8080"
    environment:
      # Set to the OAuth client ids of the web/desktop/mobile apps to enable
      # Google sign-in; leave unset to disable it.
      ASKRYPT_GOOGLE_CLIENT_IDS: "${ASKRYPT_GOOGLE_CLIENT_IDS:-}"
      # reCAPTCHA v3 on the website's auth forms. With no site key the forms
      # are unprotected beyond the rate limiter, but also need no JavaScript.
      ASKRYPT_RECAPTCHA_SITE_KEY: "${ASKRYPT_RECAPTCHA_SITE_KEY:-}"
      ASKRYPT_RECAPTCHA_SECRET: "${ASKRYPT_RECAPTCHA_SECRET:-}"
      ASKRYPT_RECAPTCHA_MIN_SCORE: "${ASKRYPT_RECAPTCHA_MIN_SCORE:-}"
      # Email relay. With no host the server logs message bodies (tokens and
      # all) instead of delivering them — set these in the .env.
      ASKRYPT_SMTP_HOST: "${ASKRYPT_SMTP_HOST:-}"
      ASKRYPT_SMTP_FROM: "${ASKRYPT_SMTP_FROM:-}"
      ASKRYPT_SMTP_ENCRYPTION: "${ASKRYPT_SMTP_ENCRYPTION:-starttls}"
      ASKRYPT_SMTP_PORT: "${ASKRYPT_SMTP_PORT:-}"
      ASKRYPT_SMTP_USERNAME: "${ASKRYPT_SMTP_USERNAME:-}"
      ASKRYPT_SMTP_PASSWORD: "${ASKRYPT_SMTP_PASSWORD:-}"
      # Each concurrent argon2 hash holds ~19 MiB; on a small VPS set this
      # rather than inheriting the CPU count.
      ASKRYPT_ARGON2_PARALLELISM: "${ASKRYPT_ARGON2_PARALLELISM:-}"
      RUST_LOG: "${RUST_LOG:-askrypt_server=info,info}"
    volumes:
      # Bind mounts, not named volumes: the state is meant to be visible on
      # the host, in the deployment directory. The paths match on both sides,
      # so `/home/askrypt-server/data/askrypt.db` in a log line is also where
      # the file is on the server. Relative on purpose — compose resolves
      # these against this file's own directory, which *is*
      # /home/askrypt-server there, while a local run stays inside the repo.
      # Both must be owned by uid 10001 before the container starts; run.sh
      # does that.
      - ./data:/home/askrypt-server/data
      # Daily log files (the image sets ASKRYPT_LOG_DIR); without this mount
      # they would vanish with the container.
      - ./logs:/home/askrypt-server/logs
    healthcheck:
      # No curl in the runtime image; the server answers /healthz and the
      # deploy probes it from the Caddy container, which has busybox wget.
      test: ["CMD", "/usr/local/bin/askrypt-server", "--help"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    container_name: askrypt-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The Caddyfile is checked in with no hostname of its own, so the site
      # address comes from here. Failing loudly beats asking Let's Encrypt for
      # a certificate for the literal string.
      ASKRYPT_DOMAIN: "${ASKRYPT_DOMAIN:?set ASKRYPT_DOMAIN in the .env beside this compose file}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # The Caddyfile logs to /var/log/caddy; without this the access log
      # would go with the container.
      - caddy-logs:/var/log/caddy
    depends_on:
      - askrypt-server

# The server's own state is bind-mounted (see above); what is left is Caddy's,
# which nobody needs to reach from the host — caddy-data holds the
# certificates, so it is the one worth knowing about.
volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
