# Deploy playbook for spot (https://github.com/umputun/spot); run via ./deploy.sh dev|prod.
#
# The image is built *locally* and shipped as a tarball, so the server needs
# nothing but docker — no rust toolchain, no git checkout, no registry.
#
# Prerequisites:
#   - spot installed locally: brew install umputun/apps/spot
#   - SSH key access to the hosts; the remote user must be in the `docker` group (no sudo used)
#   - server arch must match the local build arch (PLATFORM=linux/amd64 ./docker-build.sh otherwise)
#   - /home/askrypt-server/.env exists on each server (ASKRYPT_DOMAIN + the SMTP secrets; never
#     uploaded). See env.example for the keys; docker compose reads that file by itself.
#
# The state is /home/askrypt-server/data (database + vault blobs) and
# /home/askrypt-server/logs, bind-mounted into the container at the same
# paths. Together with the .env they are the only things in that directory
# worth keeping: the compose file, the Caddyfile and run.sh are overwritten
# from git on every deploy, and the image tarball is deleted after loading.
#
# Fill in the real host/user values below (placeholders ship in git).
# Copy destinations are sftp paths; absolute paths are used as-is (sftp does not expand ~).
user: ruslan
ssh_key: ~/.ssh/id_rsa

# TODO: avoid using root user
targets:
  dev:
    hosts:
      - {host: "arusdev3", user: "root", name: "dev"}
  prod:
    hosts:
      - {host: "bothost", user: "root", name: "prod"}

tasks:
  - name: deploy
    commands:
      # First, so a missing .env costs a second rather than a full release
      # build followed by a failed compose.
      - name: check env file
        script: |
          if [ ! -f /home/askrypt-server/.env ]; then
            echo "ERROR: /home/askrypt-server/.env is missing on {SPOT_REMOTE_HOST}" >&2
            echo "Create it from server/deploy/env.example and re-run" >&2
            exit 1
          fi
          if ! grep -q '^ASKRYPT_DOMAIN=.' /home/askrypt-server/.env; then
            echo "ERROR: ASKRYPT_DOMAIN is not set in /home/askrypt-server/.env" >&2
            echo "Caddy needs it to request a certificate for the right name" >&2
            exit 1
          fi
          if ! grep -q '^ASKRYPT_SMTP_HOST=.' /home/askrypt-server/.env; then
            echo "WARNING: ASKRYPT_SMTP_HOST is unset — outgoing email will be" >&2
            echo "LOGGED IN FULL (tokens included) instead of delivered" >&2
          fi

      - name: build image
        script: |
          ./docker-build.sh
          docker save askrypt-server | gzip > /tmp/askrypt-image.tar.gz
        options: {local: true}
        on_exit: "rm -f /tmp/askrypt-image.tar.gz"

      - name: upload image
        copy: {src: "/tmp/askrypt-image.tar.gz", dst: "/home/askrypt-server/askrypt-image.tar.gz", mkdir: true}

      - name: upload compose file
        copy: {src: "docker-compose.yml", dst: "/home/askrypt-server/docker-compose.yml"}

      - name: upload caddyfile
        copy: {src: "Caddyfile", dst: "/home/askrypt-server/Caddyfile"}

      - name: upload run script
        copy: {src: "run.sh", dst: "/home/askrypt-server/run.sh"}

      - name: load image
        script: "gunzip -c /home/askrypt-server/askrypt-image.tar.gz | docker load"
        on_exit: "rm -f /home/askrypt-server/askrypt-image.tar.gz"

      # run.sh prepares the bind-mounted data/logs directories and then brings
      # the stack up; it is the same script one would type on the server. The
      # chmod is here because the upload above does not carry the mode.
      - name: run
        script: |
          chmod +x /home/askrypt-server/run.sh
          /home/askrypt-server/run.sh

      - name: verify running
        wait: {cmd: "docker inspect -f '{{.State.Running}}' askrypt-server | grep -q true", timeout: "30s", interval: "2s"}

      # Real liveness, and it proves the compose network too: the server image
      # has no http client, so ask from Caddy's side (busybox wget, Alpine).
      - name: verify serving
        wait: {cmd: "docker exec askrypt-caddy wget -q -O- http://askrypt-server:8080/healthz | grep -q ok", timeout: "30s", interval: "2s"}

      - name: show logs
        script: "docker logs --tail 20 askrypt-server"
